
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Nova guia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="center-content">

            <!-- LOGOTIPO GOOGLE -->
            <img
                class="google-logo"
                src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
                alt="Google"
                width="272"
                height="92"
                draggable="false"
            >

            <!-- BARRA DE DIGITAÇÃO -->
            <div class="search-wrap">
                <div class="search-box">

                    <!-- LUPA -->
                    <svg class="search-symbol" viewBox="0 0 24 24">
                        <circle cx="10.8" cy="10.8" r="6.3"/>
                        <path d="m15.5 15.5 5 5"/>
                    </svg>

                    <input
                        id="searchInput"
                        type="text"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-label="Barra de digitação"
                    >

                    <!-- MICROFONE -->
                    <button class="icon-button" type="button" aria-label="Microfone">
                        <svg class="mic-symbol" viewBox="0 0 24 24">
                            <rect x="9" y="2.5" width="6" height="12" rx="3"/>
                            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
                            <path d="M12 18v3.5M9 21.5h6"/>
                        </svg>
                    </button>

                    <!-- GOOGLE LENS -->
                    <button class="icon-button" type="button" aria-label="Google Lens">
                        <svg class="lens-symbol" viewBox="0 0 24 24">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                            <circle cx="10.5" cy="10.5" r="3.5"/>
                            <path d="m13.2 13.2 4 4"/>
                        </svg>
                    </button>

                </div>
            </div>

            <!-- ATALHOS -->
            <nav class="shortcuts" aria-label="Atalhos">

                <!-- GOOGLE -->
                <button class="shortcut" type="button">
                    <span class="shortcut-icon google-icon">
                        <svg viewBox="0 0 48 48">
                            <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/>
                            <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/>
                            <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3z"/>
                            <path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12z"/>
                        </svg>
                    </span>
                    <span class="shortcut-label">Google</span>
                </button>

                <!-- YOUTUBE -->
                <button class="shortcut" type="button">
                    <span class="shortcut-icon youtube-icon">
                        <svg viewBox="0 0 48 48">
                            <rect x="5" y="11" width="38" height="26" rx="8"/>
                            <path d="m20 17 12 7-12 7z"/>
                        </svg>
                    </span>
                    <span class="shortcut-label">YouTube</span>
                </button>

                <!-- WHATSAPP -->
                <button class="shortcut" type="button">
                    <span class="shortcut-icon whatsapp-icon">
                        <svg viewBox="0 0 48 48">
                            <path d="M24 5a18 18 0 0 0-15.5 27.2L6 42l10-2.6A18 18 0 1 0 24 5z"/>
                            <path d="M18 15c-.5-1-1-1-1.6-1-.4 0-.9 0-1.3.6-.5.5-1.7 1.7-1.7 4.1s1.8 4.7 2 5c.3.3 3.5 5.6 8.6 7.6 4.2 1.7 5.1 1.4 6 .9.9-.4 2.8-1.2 3.2-2.4.4-1.2.4-2.2.3-2.4-.1-.2-.5-.4-1-.7l-3.1-1.5c-.4-.2-.8-.3-1.1.3-.4.6-1.3 1.5-1.6 1.8-.3.3-.6.4-1.1.1-.5-.2-2.1-.8-4-2.5-1.5-1.3-2.5-3-2.8-3.5-.3-.5 0-.8.2-1 .2-.2.5-.6.8-.9.2-.3.3-.5.5-.8.2-.3.1-.6 0-.9L18 15z"/>
                        </svg>
                    </span>
                    <span class="shortcut-label">WhatsApp</span>
                </button>

                <!-- ADICIONAR -->
                <button class="shortcut" type="button">
                    <span class="shortcut-icon add-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </span>
                    <span class="shortcut-label">Adicionar atalho</span>
                </button>

            </nav>
        </section>
    </main>

    <!-- PERSONALIZAÇÃO -->
    <button class="customize-button" type="button">
        <svg viewBox="0 0 24 24">
            <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/>
            <circle cx="12" cy="12" r="4"/>
        </svg>
        <span>Personalizar o Chrome</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
