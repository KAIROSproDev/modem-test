
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova guia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" id="search" autocomplete="off" autofocus>
            <span class="mic">🎙</span>
            <span class="lens">▣</span>
        </div>

        <div class="shortcuts" id="shortcuts">
            <div class="shortcut">
                <div class="shortcut-icon">G</div>
                <span>Google</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon">▶</div>
                <span>YouTube</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon">W</div>
                <span>WhatsApp</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon">+</div>
                <span>Adicionar atalho</span>
            </div>

        </div>

    </main>

    <button class="customize">Personalizar o Chrome</button>

    <script src="script.js"></script>

</body>
</html>
